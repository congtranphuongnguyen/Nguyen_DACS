name: Frontend CI/CD Pipeline to AWS S3 & CloudFront

on:
  push:
    branches:
      - main
    paths:
      - 'coffee-web/**'
      - '.github/workflows/frontend-ci-cd.yml'

env:
  AWS_REGION: ap-southeast-1 # Thay đổi thành region của bạn
  S3_BUCKET_NAME: project-coffee-frontend-bucket # Tên S3 bucket của bạn
  CLOUDFRONT_DISTRIBUTION_ID: E1234567890ABC # ID của CloudFront Distribution của bạn

permissions:
  contents: read

jobs:
  build-and-deploy:
    name: Build & Deploy Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: coffee-web/package-lock.json

      - name: Install Dependencies
        run: |
          cd coffee-web
          npm ci

      - name: Build Application
        run: |
          cd coffee-web
          npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL_PRODUCTION }} # API production URL trên AWS ECS

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy Built Assets to S3
        run: |
          aws s3 sync coffee-web/dist/ s3://${{ env.S3_BUCKET_NAME }} --delete

      - name: Invalidate CloudFront Cache
        run: |
          aws cloudfront create-invalidation --distribution-id ${{ env.CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"
